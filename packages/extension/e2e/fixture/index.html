<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Squashflow fixture</title>

      /* Hostile page styles: they must not reach the pin UI. */
      * {
        font-family: serif !important;
        color: red !important;
      }
      button {
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Pricing</h1>
      <section class="card">
        <p>Pro plan</p>
        <button id="buy" type="button">Buy now</button>
        <input id="email" type="email" value="person@example.com" />
        <input type="password" value="hunter2-secret" />
      </section>
    </main>
    <script>
      window.buyClicks = 0;
      document.getElementById("buy").addEventListener("click", () => {
        window.buyClicks += 1;
      });
    </script>
  </body>
</html>
